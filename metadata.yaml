versions:
  - sha: a4b516c170bce0a991e9fbdd632037382f1dec34
    changeNotes: |
      Map your own data layer names: the new Items field takes your products list name, and Product Name, Price, Product ID and Quantity take your field names inside each product.
      Breaking: Product Name, Price, Product ID and Quantity now take field names, not values. If you typed values or variables in them, replace them with your field names (for example item_id) before you publish.
      Read data layer permission is now "any key", so the tag can read your own names.
  - sha: a18f4903d7dcf207dac2eb07a25b1434a66fb934
    changeNotes: |
      Add "Add to Cart" and "Begin Checkout" to the Event Name dropdown.
      Send products as an items list with every GA4 ecommerce item.
  - sha: a92de8d2bce02b866530abecd46e8664f0c39ca4
    changeNotes: |
      Add product-level event mapping (name, price, product ID, quantity) with
      automatic GA4 dataLayer ecommerce parsing.
      Fix enabling conditions that crashed tag instantiation.
  - sha: a36c2220908bcfee106c02304eb3b9db606e82ac
    changeNotes: Initial release
